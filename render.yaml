services:
  - type: web
    name: cityops-backend
    runtime: node
    rootDir: cityops-backend
    buildCommand: npm install && npx prisma generate
    startCommand: node app.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
